
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
.wrap { padding: 1.5rem 0; font-family: var(--font-mono); font-size: 13px; }
.tree-line { display: flex; align-items: flex-start; gap: 0; line-height: 1.7; cursor: default; }
.tree-line:hover .label { color: var(--color-text-primary); }
.indent { white-space: pre; color: var(--color-border-secondary); user-select: none; }
.icon { margin-right: 5px; font-size: 14px; }
.label { color: var(--color-text-primary); }
.label.dir { font-weight: 500; }
.label.file { color: var(--color-text-secondary); }
.label.ansible { color: #534AB7; font-weight: 500; }
.label.ansible-file { color: #7F77DD; }
.label.comment { color: var(--color-text-tertiary); font-family: var(--font-sans); font-size: 12px; margin-left: 10px; font-style: italic; }

.tooltip { display: none; position: absolute; background: var(--color-background-primary); border: 0.5px solid var(--color-border-secondary); border-radius: 8px; padding: 10px 14px; font-family: var(--font-sans); font-size: 13px; color: var(--color-text-primary); max-width: 300px; line-height: 1.6; z-index: 10; box-shadow: none; pointer-events: none; }
.tooltip.show { display: block; }
.tooltip strong { font-weight: 500; display: block; margin-bottom: 4px; color: var(--color-text-primary); }
.tooltip code { font-family: var(--font-mono); font-size: 11px; background: var(--color-background-secondary); padding: 1px 4px; border-radius: 3px; }

.tree-line.clickable { cursor: pointer; border-radius: 4px; }
.tree-line.clickable:hover { background: var(--color-background-secondary); }

.legend { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 1.5rem; padding-top: 1rem; border-top: 0.5px solid var(--color-border-tertiary); font-family: var(--font-sans); font-size: 12px; }
.legend-item { display: flex; align-items: center; gap: 6px; color: var(--color-text-secondary); }
.dot { width: 10px; height: 10px; border-radius: 50%; }
</style>

<div class="wrap">
<div id="tooltip" class="tooltip"></div>

<div id="tree"></div>

<div class="legend">
  <div class="legend-item"><div class="dot" style="background:#534AB7"></div> Ansible files</div>
  <div class="legend-item"><div class="dot" style="background:#3B6D11"></div> Frontend</div>
  <div class="legend-item"><div class="dot" style="background:#185FA5"></div> Backend</div>
  <div class="legend-item"><div class="dot" style="background:#854F0B"></div> Config / infra</div>
  <div class="legend-item" style="font-style:italic">Hover any file for details</div>
</div>
</div>

<script>
const tree = [
  { indent: "", icon: "ti-folder", label: "my-project/", type: "dir", info: "Root of the entire project. Contains three sibling directories: frontend, backend, and ansible. The ansible directory sits alongside your app code — not inside it.", title: "Project root" },

  { indent: "│\n", icon: "", label: "", type: "spacer" },
  { indent: "├── ", icon: "ti-folder", label: "frontend/", type: "dir-green", info: "Your React / Vue / Next.js app. Completely separate from Ansible — it has its own package.json, src/, and build output. Ansible will deploy the built output to your servers.", title: "Frontend app" },
  { indent: "│   ├── ", icon: "ti-file", label: "package.json", type: "file-green", info: "Node dependencies and build scripts. Ansible can run `npm install && npm run build` on the server as part of a deployment task.", title: "package.json" },
  { indent: "│   ├── ", icon: "ti-folder", label: "src/", type: "dir-green", info: "Your React/Vue component source. Ansible doesn't touch this directly — it deploys the compiled output from dist/ or build/.", title: "Source files" },
  { indent: "│   ├── ", icon: "ti-folder", label: "dist/", type: "dir-green", info: "Compiled frontend output (after npm run build). Ansible copies this folder to the nginx web root on your servers using the `copy` or `synchronize` module.", title: "Built output" },
  { indent: "│   └── ", icon: "ti-file", label: ".env.example", type: "file-green", info: "Example environment file committed to git. Ansible uses a Jinja2 template (ansible/roles/frontend/templates/.env.j2) to render and deploy the real .env with actual secrets from Ansible Vault.", title: ".env.example" },

  { indent: "│\n", icon: "", label: "", type: "spacer" },
  { indent: "├── ", icon: "ti-folder", label: "backend/", type: "dir-blue", info: "Your Python / Node.js / Go API. Ansible deploys this by cloning the repo, installing dependencies, and managing the systemd service that keeps it running.", title: "Backend app" },
  { indent: "│   ├── ", icon: "ti-file", label: "requirements.txt", type: "file-blue", info: "Python dependencies. Ansible installs these on the server with: `pip: requirements=/var/www/app/requirements.txt`", title: "requirements.txt" },
  { indent: "│   ├── ", icon: "ti-folder", label: "src/", type: "dir-blue", info: "Your API source code. Ansible clones the whole repo to the server using the `git` module, not just this folder.", title: "API source" },
  { indent: "│   ├── ", icon: "ti-file", label: "Dockerfile", type: "file-blue", info: "Optional: if you containerise, Ansible can run `docker-compose up -d` using the `community.docker.docker_compose` module after deploying.", title: "Dockerfile" },
  { indent: "│   └── ", icon: "ti-file", label: ".env.example", type: "file-blue", info: "Same pattern as frontend — Ansible renders the real .env from a Jinja2 template with secrets loaded from Ansible Vault.", title: ".env.example" },

  { indent: "│\n", icon: "", label: "", type: "spacer" },
  { indent: "└── ", icon: "ti-folder", label: "ansible/", type: "dir-ansible", info: "The entire Ansible project lives here, as a sibling to frontend/ and backend/. This is the standard convention — infrastructure code alongside app code in the same repo (a 'monorepo' approach).", title: "Ansible root" },

  { indent: "    ├── ", icon: "ti-file", label: "ansible.cfg", type: "ansible-file", info: "The Ansible configuration file. Sets defaults like: inventory path, remote user, SSH key, roles path, vault password file. Ansible reads this automatically when you run from the ansible/ directory.", title: "ansible.cfg" },

  { indent: "    │\n", icon: "", label: "", type: "spacer" },
  { indent: "    ├── ", icon: "ti-folder", label: "inventories/", type: "ansible", info: "Separating inventories by environment is best practice. You have a different inventory for staging vs production — different IPs, different variables, same playbooks.", title: "Inventories" },
  { indent: "    │   ├── ", icon: "ti-folder", label: "production/", type: "ansible", info: "All production-specific host and variable definitions live here.", title: "Production env" },
  { indent: "    │   │   ├── ", icon: "ti-file", label: "hosts.ini", type: "ansible-file", info: "Lists your real production server IPs/hostnames grouped by role:\n[webservers]\n10.0.1.10\n10.0.1.11\n\n[databases]\n10.0.2.10", title: "Production hosts" },
  { indent: "    │   │   ├── ", icon: "ti-folder", label: "group_vars/", type: "ansible", info: "Variables scoped to host groups in production. Any host in [webservers] automatically gets the variables defined in group_vars/webservers.yml.", title: "Production group vars" },
  { indent: "    │   │   │   ├── ", icon: "ti-file", label: "all.yml", type: "ansible-file", info: "Variables that apply to EVERY host in production:\nenv: production\ndomain: myapp.com\ndeploy_user: deploy", title: "group_vars/all.yml" },
  { indent: "    │   │   │   ├── ", icon: "ti-file", label: "webservers.yml", type: "ansible-file", info: "Variables only for hosts in the [webservers] group:\nhttp_port: 80\nnginx_workers: 4\napp_dir: /var/www/myapp", title: "group_vars/webservers.yml" },
  { indent: "    │   │   │   └── ", icon: "ti-file", label: "databases.yml", type: "ansible-file", info: "Variables only for hosts in the [databases] group:\npostgres_version: 15\nmax_connections: 200\ndb_name: myapp_prod", title: "group_vars/databases.yml" },
  { indent: "    │   │   └── ", icon: "ti-folder", label: "host_vars/", type: "ansible", info: "Variables scoped to a SINGLE specific host. Overrides group_vars for that host. Use when one server needs a different setting than the rest of its group.", title: "Production host vars" },
  { indent: "    │   │       └── ", icon: "ti-file", label: "web1.example.com.yml", type: "ansible-file", info: "Per-host override for web1 only:\nnginx_workers: 8  # this server has more CPUs\nbackup_node: true\nThis overrides the value from group_vars/webservers.yml for this host only.", title: "host_vars/web1.yml" },

  { indent: "    │   └── ", icon: "ti-folder", label: "staging/", type: "ansible", info: "Identical structure to production/ but with staging server IPs and different variable values (e.g. env: staging, smaller instance sizes, test domain).", title: "Staging env" },
  { indent: "    │       ├── ", icon: "ti-file", label: "hosts.ini", type: "ansible-file", info: "Staging server IPs — usually fewer servers, smaller machines.", title: "Staging hosts" },
  { indent: "    │       └── ", icon: "ti-folder", label: "group_vars/", type: "ansible", info: "Same structure as production group_vars but with staging values:\nenv: staging\ndomain: staging.myapp.com", title: "Staging group vars" },

  { indent: "    │\n", icon: "", label: "", type: "spacer" },
  { indent: "    ├── ", icon: "ti-folder", label: "playbooks/", type: "ansible", info: "Top-level playbooks. Each one describes a complete operation. They import roles to do the actual work. Think of these as the entry points you actually run.", title: "Playbooks" },
  { indent: "    │   ├── ", icon: "ti-file", label: "site.yml", type: "ansible-file", info: "The master playbook. Runs everything — provisions servers, deploys frontend, deploys backend. Run for a full environment setup:\nansible-playbook playbooks/site.yml -i inventories/production/", title: "site.yml — master" },
  { indent: "    │   ├── ", icon: "ti-file", label: "deploy.yml", type: "ansible-file", info: "Deploy-only playbook. Doesn't reprovision — just pulls latest code, installs deps, restarts services. Used for day-to-day deploys:\nansible-playbook playbooks/deploy.yml -i inventories/production/", title: "deploy.yml" },
  { indent: "    │   ├── ", icon: "ti-file", label: "provision.yml", type: "ansible-file", info: "First-time server setup: installs system packages, creates users, configures firewall, sets up nginx. Run once when you spin up a new server.", title: "provision.yml" },
  { indent: "    │   └── ", icon: "ti-file", label: "rollback.yml", type: "ansible-file", info: "Rolls back to the previous release. Uses the `git` module to check out the previous commit tag and restarts services.", title: "rollback.yml" },

  { indent: "    │\n", icon: "", label: "", type: "spacer" },
  { indent: "    ├── ", icon: "ti-folder", label: "roles/", type: "ansible", info: "Roles are the reusable building blocks. Each role is a self-contained bundle of tasks, handlers, templates, and variables for one concern. Playbooks call roles.", title: "Roles" },

  { indent: "    │   ├── ", icon: "ti-folder", label: "common/", type: "ansible", info: "Runs on every server. Sets up the basics: system users, SSH hardening, unattended upgrades, common packages (curl, git, htop). Called first in site.yml.", title: "common role" },
  { indent: "    │   │   ├── ", icon: "ti-folder", label: "tasks/", type: "ansible", info: "" },
  { indent: "    │   │   │   └── ", icon: "ti-file", label: "main.yml", type: "ansible-file", info: "The tasks entry point for the common role. Ansible always auto-loads tasks/main.yml first when a role is called.", title: "common/tasks/main.yml" },
  { indent: "    │   │   ├── ", icon: "ti-folder", label: "handlers/", type: "ansible", info: "" },
  { indent: "    │   │   │   └── ", icon: "ti-file", label: "main.yml", type: "ansible-file", info: "Handlers for the common role. E.g.: 'Restart sshd' — triggered when the SSH config file changes.", title: "common/handlers/main.yml" },
  { indent: "    │   │   └── ", icon: "ti-folder", label: "defaults/", type: "ansible", info: "" },
  { indent: "    │   │       └── ", icon: "ti-file", label: "main.yml", type: "ansible-file", info: "Default variable values for the common role. Lowest priority — easily overridden by group_vars or host_vars.", title: "common/defaults/main.yml" },

  { indent: "    │   ├── ", icon: "ti-folder", label: "webserver/", type: "ansible", info: "Installs and configures nginx. Manages the nginx service. Renders nginx.conf from a Jinja2 template with your domain and port variables.", title: "webserver role" },
  { indent: "    │   │   ├── ", icon: "ti-folder", label: "tasks/main.yml", type: "ansible-file-flat", info: "Tasks: install nginx, enable service, deploy config. Notifies 'Reload nginx' handler when config changes.", title: "webserver tasks" },
  { indent: "    │   │   ├── ", icon: "ti-folder", label: "handlers/main.yml", type: "ansible-file-flat", info: "Handlers: 'Reload nginx' (graceful reload), 'Restart nginx' (full restart). Only run if notified.", title: "webserver handlers" },
  { indent: "    │   │   └── ", icon: "ti-folder", label: "templates/", type: "ansible", info: "Jinja2 templates rendered with your variables before being copied to the server." },
  { indent: "    │   │       └── ", icon: "ti-file", label: "nginx.conf.j2", type: "ansible-file", info: "The nginx config template. Uses variables like:\nserver_name {{ domain }};\nlisten {{ http_port }};\nroot /var/www/{{ app_name }};\nAnsible renders this and copies the result to /etc/nginx/nginx.conf.", title: "nginx.conf.j2" },

  { indent: "    │   ├── ", icon: "ti-folder", label: "backend/", type: "ansible", info: "Deploys the backend API. Clones the repo, installs Python deps, renders .env from template, manages the systemd service.", title: "backend role" },
  { indent: "    │   │   ├── ", icon: "ti-folder", label: "tasks/main.yml", type: "ansible-file-flat", info: "Tasks: git clone, pip install, template .env, systemctl enable+start. Notifies 'Restart backend' if code or .env changed.", title: "backend tasks" },
  { indent: "    │   │   ├── ", icon: "ti-folder", label: "handlers/main.yml", type: "ansible-file-flat", info: "'Restart backend' handler: restarts the systemd service. Only runs if notified — so it doesn't restart on every deploy if nothing changed.", title: "backend handlers" },
  { indent: "    │   │   ├── ", icon: "ti-folder", label: "templates/", type: "ansible", info: "Jinja2 templates for the backend." },
  { indent: "    │   │   │   └── ", icon: "ti-file", label: ".env.j2", type: "ansible-file", info: "Renders the real .env file with secrets from Ansible Vault:\nDATABASE_URL={{ db_url }}\nSECRET_KEY={{ secret_key }}\nAnsible Vault encrypts db_url and secret_key — they're decrypted at deploy time.", title: ".env.j2 template" },
  { indent: "    │   │   └── ", icon: "ti-folder", label: "files/", type: "ansible", info: "Static files deployed as-is (no templating). E.g. a systemd .service unit file for your backend process." },
  { indent: "    │   │       └── ", icon: "ti-file", label: "myapp.service", type: "ansible-file", info: "The systemd unit file for your backend. Copied as-is to /etc/systemd/system/. Defines how systemd starts, stops, and restarts your app.", title: "myapp.service" },

  { indent: "    │   └── ", icon: "ti-folder", label: "frontend/", type: "ansible", info: "Deploys the built frontend. Copies dist/ to the nginx web root. Renders the frontend .env if needed.", title: "frontend role" },
  { indent: "    │       ├── ", icon: "ti-folder", label: "tasks/main.yml", type: "ansible-file-flat", info: "Tasks: synchronize dist/ to /var/www/html, set permissions, optionally run npm build on the server.", title: "frontend tasks" },
  { indent: "    │       └── ", icon: "ti-folder", label: "templates/.env.j2", type: "ansible-file-flat", info: "Frontend .env template — injects public env vars like VITE_API_URL={{ api_url }} before the build or at deploy time.", title: "frontend .env.j2" },

  { indent: "    │\n", icon: "", label: "", type: "spacer" },
  { indent: "    ├── ", icon: "ti-folder", label: "group_vars/", type: "ansible", info: "A second group_vars location — at the ansible/ root level, not inside inventories/. Used for variables that are the SAME across all environments (production + staging). Environment-specific ones live inside inventories/production/group_vars/.", title: "Shared group vars" },
  { indent: "    │   └── ", icon: "ti-file", label: "all.yml", type: "ansible-file", info: "Variables shared across every environment and every host:\napp_name: myapp\nrepo_url: https://github.com/you/myapp.git\ndeploy_dir: /var/www\nThese never change between staging and production.", title: "Shared all.yml" },

  { indent: "    │\n", icon: "", label: "", type: "spacer" },
  { indent: "    └── ", icon: "ti-folder", label: "vault/", type: "ansible", info: "Encrypted secrets, managed with ansible-vault. These files are safe to commit to git — the contents are encrypted. Never store plaintext secrets anywhere in this tree.", title: "Vault (secrets)" },
  { indent: "        ├── ", icon: "ti-file", label: "secrets.yml", type: "ansible-file", info: "Encrypted with ansible-vault. Contains:\ndb_password: !vault |\n  $ANSIBLE_VAULT;1.1;AES256\n  ...(gibberish)...\nDecrypted at runtime with --ask-vault-pass or a vault password file.", title: "secrets.yml (encrypted)" },
  { indent: "        └── ", icon: "ti-file", label: ".vault_pass", type: "file-amber", info: "The vault password file — listed in .gitignore, NEVER committed. Referenced in ansible.cfg:\nvault_password_file = vault/.vault_pass\nSo you don't have to type --ask-vault-pass every time.", title: ".vault_pass (gitignored!)" },
];

function getColors(type) {
  if (type === 'dir-green') return { icon: '#3B6D11', label: '#3B6D11' };
  if (type === 'file-green') return { icon: '#639922', label: '#3B6D11' };
  if (type === 'dir-blue') return { icon: '#185FA5', label: '#185FA5' };
  if (type === 'file-blue') return { icon: '#378ADD', label: '#185FA5' };
  if (type === 'dir-ansible' || type === 'ansible') return { icon: '#534AB7', label: '#534AB7' };
  if (type === 'ansible-file' || type === 'ansible-file-flat') return { icon: '#7F77DD', label: '#7F77DD' };
  if (type === 'file-amber') return { icon: '#BA7517', label: '#854F0B' };
  return { icon: 'var(--color-text-secondary)', label: 'var(--color-text-secondary)' };
}

function getIconName(type, icon) {
  if (icon === 'ti-folder') return 'ti-folder';
  if (icon === 'ti-file') return 'ti-file';
  return '';
}

function render() {
  const container = document.getElementById('tree');
  const tooltip = document.getElementById('tooltip');

  tree.forEach(item => {
    if (item.type === 'spacer') {
      const div = document.createElement('div');
      div.style.height = '4px';
      container.appendChild(div);
      return;
    }

    const div = document.createElement('div');
    div.className = 'tree-line' + (item.info ? ' clickable' : '');

    const colors = getColors(item.type);
    const isDir = item.icon === 'ti-folder';
    const isAnsible = item.type.includes('ansible');
    const isFlat = item.type === 'ansible-file-flat' || item.type === 'dir-green' && item.label.includes('/');

    const labelClass = isDir ? 'dir' : 'file';
    const extraClass = isAnsible ? (isDir ? 'ansible' : 'ansible-file') : '';

    let html = `<span class="indent">${item.indent}</span>`;
    if (item.icon) {
      html += `<i class="ti ${item.icon} icon" aria-hidden="true" style="color:${colors.icon}; font-size:15px; margin-top:1px; flex-shrink:0"></i>`;
    }
    html += `<span class="label ${labelClass} ${extraClass}" style="color:${colors.label}">${item.label}</span>`;

    if (item.info && item.comment) {
      html += `<span class="comment">${item.comment}</span>`;
    }

    div.innerHTML = html;

    if (item.info) {
      div.addEventListener('mouseenter', e => {
        tooltip.innerHTML = `<strong>${item.title || item.label}</strong>${item.info}`;
        tooltip.classList.add('show');
        const rect = div.getBoundingClientRect();
        const wrap = document.querySelector('.wrap');
        const wrapRect = wrap.getBoundingClientRect();
        tooltip.style.left = '0px';
        tooltip.style.top = (div.offsetTop + div.offsetHeight + 4) + 'px';
      });
      div.addEventListener('mouseleave', () => tooltip.classList.remove('show'));
    }

    container.appendChild(div);
  });
}

render();
</script>
